apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapzy-api
  labels:
    app: snapzy-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snapzy-api
  template:
    metadata:
      labels:
        app: snapzy-api
    spec:
      containers:
      - name: api
        image: snapzy/api:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: snapzy-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: snapzy-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: snapzy-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: snapzy-secrets
              key: jwt-refresh-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: snapzy-api-service
spec:
  selector:
    app: snapzy-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP