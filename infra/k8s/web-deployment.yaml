apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapzy-web
  labels:
    app: snapzy-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snapzy-web
  template:
    metadata:
      labels:
        app: snapzy-web
    spec:
      containers:
      - name: web
        image: snapzy/web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.snapzy.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: snapzy-web-service
spec:
  selector:
    app: snapzy-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP